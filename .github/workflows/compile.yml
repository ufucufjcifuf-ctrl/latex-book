name: Compile LaTeX Book
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile LuaLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: book.tex
          compiler: lualatex
          extra_system_packages: "fonts-kalpurush"

      - name: Upload Finished PDF
        uses: actions/upload-artifact@v4
        with:
          name: Admission_Model_Test_Book
          path: book.pdf
